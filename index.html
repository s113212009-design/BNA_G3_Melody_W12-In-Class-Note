<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BNA Knowledge Base SPA</title>
  <style>
    :root{
      --bg:#f7f9fc;--surface:#fff;--soft:#f1f5f9;--text:#1f2937;--muted:#64748b;
      --line:#dbe4ee;--accent:#7ea6d8;--accent-soft:#e9f2fb;--shadow:0 10px 30px rgba(31,41,55,.08)
    }
    html[data-theme="dark"]{
      --bg:#101722;--surface:#172131;--soft:#202c3e;--text:#eef2f7;--muted:#aeb9c8;
      --line:#334155;--accent:#90b8e5;--accent-soft:#20384f;--shadow:0 12px 34px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}
    button,a{font:inherit}
    .topbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .left-head,.brand,.top-actions{display:flex;align-items:center}.left-head{gap:12px}.brand{gap:10px}.top-actions{gap:8px}
    .brand-badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}
    .brand h1{font-size:1rem;margin:0}.brand small{color:var(--muted)}
    .icon-btn,.pill,.nav-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
    .icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}.pill{padding:9px 12px;border-radius:999px}.nav-btn{padding:11px 14px;border-radius:14px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);background:var(--surface);border-right:1px solid var(--line);z-index:300;padding:18px;overflow:auto;transform:translateX(-105%);transition:.25s}
    .sidebar.open{transform:translateX(0)}.sidebar-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.sidebar-header>div{display:flex;flex-direction:column}.sidebar-header small{color:var(--muted)}
    .scrim{position:fixed;inset:0;z-index:250;background:rgba(15,23,42,.36);opacity:0;pointer-events:none;transition:.2s}.scrim.show{opacity:1;pointer-events:auto}
    .module-btn{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:12px 14px;border-radius:12px;margin:3px 0;cursor:pointer}
    .module-btn:hover,.module-btn.active{background:var(--accent-soft);color:var(--accent)}.module-btn small{display:block;color:var(--muted)}
    .shell{max-width:980px;margin:auto;padding:34px 18px 0}
    .hero{border:1px solid var(--line);border-radius:28px;padding:32px;background:linear-gradient(145deg,var(--accent-soft),var(--surface));box-shadow:var(--shadow)}
    .eyebrow{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .hero h2{margin:0 0 14px;font-size:clamp(2rem,5vw,3.2rem);line-height:1.08}.hero p{max-width:760px;color:var(--muted)}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.tag{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:.84rem}
    .content-panel{margin-top:22px;padding:30px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
    .content-panel h3{margin-top:0}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px;background:var(--soft);border-radius:16px;margin:14px 0}
    .step{padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:700}.arrow{color:var(--muted);font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}.card strong{display:block;margin-bottom:6px}
    .note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 12px 12px 0}
    .bottom-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px 0 34px}.bottom-nav .nav-btn:first-child{justify-self:start}.bottom-nav .nav-btn:last-child{justify-self:end}.nav-btn:disabled{opacity:.35}.top-link{color:var(--accent);text-decoration:none;font-weight:700;font-size:.9rem}
    .footer{border-top:1px solid var(--line);padding:28px 18px 38px;color:var(--muted);font-size:.84rem;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;text-align:center}
    @media(max-width:700px){.brand small{display:none}.topbar{padding:10px 12px}.shell{padding:22px 12px 0}.hero{padding:24px 20px}.content-panel{padding:22px 18px}.grid{grid-template-columns:1fr}.bottom-nav{grid-template-columns:1fr 1fr}.top-link{grid-column:1/-1;grid-row:2;text-align:center}.footer{flex-direction:column;gap:4px}}
  </style>
</head>
<body>
<header class="topbar" id="top">
  <div class="left-head">
    <button id="menuBtn" class="icon-btn" aria-label="Open modules">☰</button>
    <div class="brand"><div class="brand-badge">BNA</div><div><h1>Knowledge Base</h1><small id="brandSub">Business News & Analysis</small></div></div>
  </div>
  <div class="top-actions"><button id="langBtn" class="pill">EN / 中</button><button id="themeBtn" class="pill">☀ / ☾</button></div>
</header>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-header"><div><strong id="modulesLabel">Modules</strong><small id="modulesHint">Switch between sub-topics</small></div><button id="closeBtn" class="icon-btn">×</button></div>
  <nav id="moduleNav"></nav>
</aside>
<div id="scrim" class="scrim"></div>

<main class="shell">
  <section class="hero">
    <div class="eyebrow" id="eyebrow">Bilingual Learning SPA</div>
    <h2 id="pageTitle"></h2><p id="pageIntro"></p><div id="tags" class="tags"></div>
  </section>
  <section class="content-panel"><div id="pageContent"></div></section>
  <nav class="bottom-nav">
    <button id="prevBtn" class="nav-btn">← <span id="prevText">Previous page</span></button>
    <a href="#top" class="top-link" id="topText">Return to the top ↑</a>
    <button id="nextBtn" class="nav-btn"><span id="nextText">Next page</span> →</button>
  </nav>
</main>

<footer class="footer">
  <span><strong>Architect:</strong> Prof. Shihmin Lo</span>
  <span><strong>Version:</strong> 1.0.0</span>
  <span>© 2026 Prof. Shihmin Lo. All rights reserved.</span>
</footer>

<script>
const modules=[
{en:{title:"Analytical Thinking",intro:"A systematic process for separating complexity, investigating with evidence, identifying relationships, and recombining findings into insight.",tags:["Systematic","Structured","Process-oriented"],body:`<h3>Core Process</h3><div class="flow"><span class="step">Problem / Demand / Questions</span><span class="arrow">→</span><span class="step">Separate</span><span class="arrow">→</span><span class="step">Investigate with evidence</span><span class="arrow">→</span><span class="step">Find relationships</span><span class="arrow">→</span><span class="step">Recombine</span><span class="arrow">→</span><span class="step">Insight</span></div><div class="grid"><div class="card"><strong>Effective</strong>Goal / purpose reached.</div><div class="card"><strong>Efficient</strong>Output ÷ Input.</div></div>`},zh:{title:"分析思維",intro:"以系統化方式拆解複雜問題、以證據調查、找出關係，再重新組合成洞見。",tags:["系統化","結構化","流程導向"],body:`<h3>核心流程</h3><div class="flow"><span class="step">問題 / 需求 / 問題意識</span><span class="arrow">→</span><span class="step">拆解</span><span class="arrow">→</span><span class="step">以證據調查</span><span class="arrow">→</span><span class="step">找出關係</span><span class="arrow">→</span><span class="step">重新組合</span><span class="arrow">→</span><span class="step">洞見</span></div><div class="grid"><div class="card"><strong>Effective 有效</strong>是否達成目標／目的。</div><div class="card"><strong>Efficient 效率</strong>Output ÷ Input。</div></div>`}},
{en:{title:"Product Development",intro:"Connect demand and supply to product requirements, PRD, MVP, commercialization, and market value.",tags:["Product","PRD","MVP","Market","WTP"],body:`<h3>Requirement to PRD</h3><div class="flow"><span class="step">Demand / Supply</span><span class="arrow">→</span><span class="step">Product</span><span class="arrow">→</span><span class="step">Requirement</span><span class="arrow">→</span><span class="step">Document</span><span class="arrow">→</span><span class="step">PRD</span></div><p class="note"><strong>PRD:</strong> functions + verifications.</p><h4>Product to Market</h4><div class="flow"><span class="step">Product</span><span class="arrow">→</span><span class="step">MVP</span><span class="arrow">→</span><span class="step">Commercialized / Transacted</span><span class="arrow">→</span><span class="step">Market</span><span class="arrow">→</span><span class="step">Value / WTP</span></div>`},zh:{title:"產品開發",intro:"把需求與供給連結到產品需求、PRD、MVP、商業化與市場價值。",tags:["產品","PRD","MVP","市場","WTP"],body:`<h3>需求到 PRD</h3><div class="flow"><span class="step">需求 / 供給</span><span class="arrow">→</span><span class="step">產品</span><span class="arrow">→</span><span class="step">需求</span><span class="arrow">→</span><span class="step">文件</span><span class="arrow">→</span><span class="step">PRD</span></div><p class="note"><strong>PRD：</strong> functions 功能 + verifications 驗證。</p><h4>產品到市場</h4><div class="flow"><span class="step">Product</span><span class="arrow">→</span><span class="step">MVP</span><span class="arrow">→</span><span class="step">商業化 / 交易</span><span class="arrow">→</span><span class="step">市場</span><span class="arrow">→</span><span class="step">價值 / WTP</span></div>`}},
{en:{title:"AI Agents & Knowledge Workflow",intro:"Use AI together with creativity and critical thinking to transform class materials into structured knowledge.",tags:["Chatbot","Task Agent","Coding Agent","KB.md"],body:`<h3>AI Support</h3><div class="grid"><div class="card"><strong>Chatbot</strong>Conversation and interaction.</div><div class="card"><strong>Task Agent</strong>Task-oriented execution.</div><div class="card"><strong>Coding Agent</strong>Coding and technical support.</div><div class="card"><strong>Discussion / Consultancy</strong>Supports analysis before summarization.</div></div><h4>Knowledge Processing Workflow</h4><div class="flow"><span class="step">Notes / Voice / Video / Images</span><span class="arrow">→</span><span class="step">AI + Human Thinking</span><span class="arrow">→</span><span class="step">Analysis</span><span class="arrow">→</span><span class="step">Summary</span><span class="arrow">→</span><span class="step">Markdown</span><span class="arrow">→</span><span class="step">KB.md</span></div>`},zh:{title:"AI Agent 與知識工作流",intro:"結合 AI、創意與批判思考，把課堂素材轉換成結構化知識。",tags:["Chatbot","Task Agent","Coding Agent","KB.md"],body:`<h3>AI 支援</h3><div class="grid"><div class="card"><strong>Chatbot</strong>對話與互動。</div><div class="card"><strong>Task Agent</strong>任務導向執行。</div><div class="card"><strong>Coding Agent</strong>程式與技術支援。</div><div class="card"><strong>Discussion / Consultancy</strong>在摘要前協助討論與分析。</div></div><h4>知識處理流程</h4><div class="flow"><span class="step">筆記 / 語音 / 影片 / 圖片</span><span class="arrow">→</span><span class="step">AI + 人的思考</span><span class="arrow">→</span><span class="step">分析</span><span class="arrow">→</span><span class="step">摘要</span><span class="arrow">→</span><span class="step">Markdown</span><span class="arrow">→</span><span class="step">KB.md</span></div>`}},
{en:{title:"Knowledge Handoff",intro:"Markdown supports reusable, editable, and transferable knowledge across people and work stages.",tags:["KB.md","Handoff","PRD.md","Collaboration"],body:`<h3>Knowledge Handoff</h3><div class="flow"><span class="step">KB.md</span><span class="arrow">→</span><span class="step">handoff .md</span><span class="arrow">→</span><span class="step">PRD.md</span></div><h4>Team Workflow</h4><div class="flow"><span class="step">Team Member #1</span><span class="arrow">→</span><span class="step">Markdown Handoff</span><span class="arrow">→</span><span class="step">Team Member #2</span></div>`},zh:{title:"知識交接",intro:"Markdown 可讓知識在不同人員與工作階段之間重複使用、持續編輯與交接。",tags:["KB.md","交接","PRD.md","協作"],body:`<h3>知識交接</h3><div class="flow"><span class="step">KB.md</span><span class="arrow">→</span><span class="step">handoff .md</span><span class="arrow">→</span><span class="step">PRD.md</span></div><h4>團隊流程</h4><div class="flow"><span class="step">Team Member #1</span><span class="arrow">→</span><span class="step">Markdown 交接</span><span class="arrow">→</span><span class="step">Team Member #2</span></div>`}},
{en:{title:"Web / Digital Product",intro:"BNA Agent can work with webpages and websites as information or service interfaces.",tags:["BNA Agent","Webpages","Front-end","Back-end","SVG"],body:`<h3>Web Structure</h3><div class="flow"><span class="step">BNA Agent</span><span class="arrow">→</span><span class="step">Webpages / Website</span><span class="arrow">→</span><span class="step">Information / Service</span></div><div class="grid"><div class="card"><strong>Front-end</strong>User-facing interface.</div><div class="card"><strong>Back-end</strong>Supporting logic and services.</div></div><h4>Web Content Formats</h4><p>PNG · JPEG · SVG</p>`},zh:{title:"網站／數位產品",intro:"BNA Agent 可使用網頁與網站作為資訊來源或服務介面。",tags:["BNA Agent","Webpages","前端","後端","SVG"],body:`<h3>網站結構</h3><div class="flow"><span class="step">BNA Agent</span><span class="arrow">→</span><span class="step">Webpages / Website</span><span class="arrow">→</span><span class="step">資訊 / 服務</span></div><div class="grid"><div class="card"><strong>Front-end 前端</strong>使用者看到與操作的介面。</div><div class="card"><strong>Back-end 後端</strong>支援系統邏輯與服務。</div></div><h4>網頁內容格式</h4><p>PNG · JPEG · SVG</p>`}},
{en:{title:"Content Design Principles",intro:"Keep learning content simple, clear, direct, and mobile-friendly.",tags:["Mobile-first","Simple","Clear","Direct"],body:`<h3>Design Guidance</h3><ul><li>Mobile phone devices are important.</li><li>Avoid designing only for landscape notebook / PC / TV displays.</li><li>Keep the style simple and clear.</li><li>Use RWD across screen sizes.</li></ul><p class="note"><strong>Principle:</strong> Simple + Clear + Mobile-friendly → Better usability</p>`},zh:{title:"內容設計原則",intro:"學習內容應保持簡單、清楚、直接，並優先考慮手機閱讀。",tags:["Mobile-first","簡單","清楚","直接"],body:`<h3>設計指引</h3><ul><li>手機裝置是重要的閱讀情境。</li><li>避免只為橫向 notebook / PC / TV 顯示器設計。</li><li>風格保持 simple、clear。</li><li>使用 RWD 適應不同螢幕尺寸。</li></ul><p class="note"><strong>原則：</strong> Simple + Clear + Mobile-friendly → Better usability</p>`}}
];

const ui={en:{brand:"Business News & Analysis",mods:"Modules",hint:"Switch between sub-topics",eye:"Bilingual Learning SPA",prev:"Previous page",next:"Next page",top:"Return to the top ↑"},zh:{brand:"商業時事分析",mods:"模組",hint:"切換不同子主題",eye:"雙語學習 SPA",prev:"上一頁",next:"下一頁",top:"回到頂端 ↑"}};
let current=0,lang=localStorage.getItem("bna-lang")||"en",theme=localStorage.getItem("bna-theme")||"light";
const $=s=>document.querySelector(s),sidebar=$("#sidebar"),scrim=$("#scrim");
function openMenu(){sidebar.classList.add("open");scrim.classList.add("show")}
function closeMenu(){sidebar.classList.remove("open");scrim.classList.remove("show")}
$("#menuBtn").onclick=openMenu;$("#closeBtn").onclick=closeMenu;scrim.onclick=closeMenu;
$("#themeBtn").onclick=()=>{theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;localStorage.setItem("bna-theme",theme)};
$("#langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";localStorage.setItem("bna-lang",lang);render()};
$("#prevBtn").onclick=()=>{if(current>0){current--;render();scrollTo({top:0,behavior:"smooth"})}};
$("#nextBtn").onclick=()=>{if(current<modules.length-1){current++;render();scrollTo({top:0,behavior:"smooth"})}};
function renderNav(){const nav=$("#moduleNav");nav.innerHTML="";modules.forEach((m,i)=>{const d=m[lang],b=document.createElement("button");b.className="module-btn"+(i===current?" active":"");b.innerHTML=`<strong>${d.title}</strong><small>${i+1} / ${modules.length}</small>`;b.onclick=()=>{current=i;render();closeMenu();scrollTo({top:0,behavior:"smooth"})};nav.appendChild(b)})}
function render(){document.documentElement.lang=lang==="en"?"en":"zh-Hant";document.documentElement.dataset.theme=theme;$("#brandSub").textContent=ui[lang].brand;$("#modulesLabel").textContent=ui[lang].mods;$("#modulesHint").textContent=ui[lang].hint;$("#eyebrow").textContent=ui[lang].eye;$("#prevText").textContent=ui[lang].prev;$("#nextText").textContent=ui[lang].next;$("#topText").textContent=ui[lang].top;const d=modules[current][lang];$("#pageTitle").textContent=d.title;$("#pageIntro").textContent=d.intro;$("#tags").innerHTML=d.tags.map(t=>`<span class="tag">${t}</span>`).join("");$("#pageContent").innerHTML=d.body;$("#prevBtn").disabled=current===0;$("#nextBtn").disabled=current===modules.length-1;renderNav()}
render();
</script>
</body>
</html>
